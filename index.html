<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hoverboard Hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@500;700;800&display=swap">
<style>
/* Layout: one full-bleed canvas; the game stage is 540 units tall and stretches sideways to fill phone screens */
:root {
  --night: #14102a;
  --ink: #fff6e8;
  --tang: #ff8a1f;
  --dart: #2f7bff;
  --slime: #7dff6a;
  --display: "Bungee", "Impact", "Arial Black", system-ui, sans-serif;
  --body: "Rubik", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html { height: 100%; box-sizing: border-box; overflow: hidden; background: var(--night); }
body { height: 100%; margin: 0; overflow: hidden; background: var(--night); color: var(--ink); font-family: var(--body); overscroll-behavior: none; }
#stage { position: relative; width: 100%; height: 100%; touch-action: none; }
#game {
  display: block; width: 100%; height: 100%;
  touch-action: none; user-select: none; -webkit-user-select: none;
  -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  outline: none;
}
</style>
</head>
<body>

<div id="stage">
  <canvas id="game" tabindex="0" aria-label="Hoverboard Hero: Links ziehen zum Fliegen, rechts halten zum Schiessen. Tastatur: WASD oder Pfeiltasten und Leertaste."></canvas>
</div>

<script>
(() => {
'use strict';

// ---------- Stage & scaling ----------
const H = 540, LW = 1600, ROAD = 490;
const DIFF = 1.2; // ~20% tougher than v1: faster enemies and bullets, denser spawns, sturdier bosses
let W = 960;
const cvs = document.getElementById('game');
const ctx = cvs.getContext('2d');
let dpr = 1, sc = 1, ox = 0, oy = 0, cssW = 1, cssH = 1;
const FONT_D = '"Bungee", "Impact", "Arial Black", sans-serif';
const FONT_B = '"Rubik", system-ui, -apple-system, "Segoe UI", sans-serif';
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

function resize() {
  const r = cvs.parentElement.getBoundingClientRect();
  cssW = Math.max(1, r.width); cssH = Math.max(1, r.height);
  dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  cvs.width = Math.round(cssW * dpr); cvs.height = Math.round(cssH * dpr);
  sc = cssH / H; W = cssW / sc;
  if (W < 720) { W = 720; sc = cssW / 720; }
  else if (W > 1280) { W = 1280; }
  ox = (cssW - W * sc) / 2; oy = (cssH - H * sc) / 2;
}
window.addEventListener('resize', resize);
if (window.ResizeObserver) new ResizeObserver(resize).observe(cvs.parentElement);
resize();

// ---------- Helpers ----------
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
function rr(c, x, y, w, h, r) {
  c.beginPath(); c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function hex(h) { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
function mix(a, b, t) { const A = hex(a), B = hex(b); return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(',')})`; }

// ---------- City layers (prerendered, tile every LW units) ----------
const NEON = [['RAMEN', '#ff4fa3'], ['HOTEL', '#4ff0ff'], ['24/7', '#ffd23f'], ['PIZZA', '#ff8a1f'], ['ARCADE', '#b26bff'], ['KINO', '#7dff6a']];
function makeLayer(o) {
  const c = document.createElement('canvas'); c.width = LW; c.height = H;
  const g = c.getContext('2d');
  const bs = []; let x = rand(0, 30);
  while (x < LW) { const w = rand(o.minW, o.maxW) | 0; bs.push({ x, w, h: rand(o.minH, o.maxH) | 0, roof: Math.random(), neon: Math.random() < o.neon ? pick(NEON) : null }); x += w + rand(o.gapMin, o.gapMax); }
  for (const b of bs) { drawBuilding(g, b, b.x, o); if (b.x + b.w > LW) drawBuilding(g, b, b.x - LW, o); }
  return c;
}
function drawBuilding(g, b, x, o) {
  const top = ROAD - b.h;
  g.fillStyle = o.color; g.fillRect(x, top, b.w, b.h);
  g.fillStyle = o.edge; g.fillRect(x, top, Math.max(3, b.w * 0.08), b.h);
  // roof furniture
  g.fillStyle = o.color; g.strokeStyle = o.color; g.lineWidth = 2;
  if (b.roof < 0.3) { g.beginPath(); g.moveTo(x + b.w * 0.6, top); g.lineTo(x + b.w * 0.6, top - o.ant); g.stroke(); g.fillStyle = '#ff4040'; g.fillRect(x + b.w * 0.6 - 2, top - o.ant - 2, 4, 4); }
  else if (b.roof < 0.55) { g.fillRect(x + b.w * 0.2, top - o.ant * 0.4, b.w * 0.25, o.ant * 0.4); }
  else if (b.roof < 0.75) { g.fillRect(x + b.w * 0.15, top - 10, b.w * 0.7, 10); }
  // windows
  const cw = o.win[0], ch = o.win[1], gx = o.win[2];
  for (let wy = top + gx + 4; wy < ROAD - ch - 4; wy += ch + gx) {
    for (let wx = x + gx + 3; wx < x + b.w - cw - 2; wx += cw + gx) {
      const lit = Math.random() < o.lit;
      g.fillStyle = lit ? pick(o.winColors) : o.dark;
      g.fillRect(wx, wy, cw, ch);
    }
  }
  if (b.neon && b.w > 90) {
    const [txt, col] = b.neon, sy = top + 26;
    g.save(); g.font = `20px ${FONT_D}`; const tw = g.measureText(txt).width + 18;
    const sx = x + (b.w - tw) / 2;
    g.fillStyle = '#120d24'; rr(g, sx, sy, tw, 32, 6); g.fill();
    g.shadowColor = col; g.shadowBlur = 14; g.strokeStyle = col; g.lineWidth = 2.5; rr(g, sx, sy, tw, 32, 6); g.stroke();
    g.fillStyle = col; g.textBaseline = 'middle'; g.fillText(txt, sx + 9, sy + 17); g.restore();
  }
}
let layers = [];
function buildLayers() {
  layers = [
    { f: 0.12, img: makeLayer({ color: '#3d2f63', edge: '#463870', dark: '#34285a', minW: 40, maxW: 110, minH: 150, maxH: 330, gapMin: -10, gapMax: 10, win: [4, 6, 6], lit: 0.25, winColors: ['#7c6aa8'], neon: 0, ant: 26 }) },
    { f: 0.32, img: makeLayer({ color: '#2a2048', edge: '#352a5a', dark: '#211a3c', minW: 60, maxW: 140, minH: 120, maxH: 300, gapMin: 6, gapMax: 40, win: [7, 10, 7], lit: 0.35, winColors: ['#ffd27a', '#ffe9b0', '#9fe8ff'], neon: 0, ant: 34 }) },
    { f: 0.6, img: makeLayer({ color: '#1b1533', edge: '#261e45', dark: '#15102a', minW: 100, maxW: 190, minH: 90, maxH: 230, gapMin: 30, gapMax: 140, win: [12, 16, 10], lit: 0.45, winColors: ['#ffc861', '#ffe2a3', '#ff9e6b'], neon: 0.6, ant: 40 }) },
  ];
}
const STARS = Array.from({ length: 70 }, () => ({ x: Math.random(), y: Math.random() * 0.55, r: rand(0.6, 1.8), p: rand(0, 6) }));

// ---------- Audio (synthesised, starts on first tap) ----------
let ac = null, master = null, noiseBuf = null;
let muted = false;
try { muted = localStorage.getItem('hh-muted') === '1'; } catch (e) {}
function ensureAudio() {
  if (!ac) {
    try {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      master = ac.createGain(); master.gain.value = muted ? 0 : 0.5; master.connect(ac.destination);
      noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { ac = null; }
  }
  if (ac && ac.state === 'suspended') ac.resume().catch(() => {});
}
function tone(f, dur, type = 'square', vol = 0.15, to = null, delay = 0) {
  if (!ac || muted) return;
  const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol = 0.2, freq = 1200, delay = 0) {
  if (!ac || muted) return;
  const t = ac.currentTime + delay, s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  s.buffer = noiseBuf; f.type = 'lowpass'; f.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur + 0.02);
}
const sfx = {
  shoot() { tone(620, 0.07, 'square', 0.05, 240); noise(0.05, 0.08, 2400); },
  hit() { tone(900, 0.07, 'triangle', 0.09, 1500); },
  splat() { noise(0.28, 0.22, 900); tone(320, 0.22, 'sawtooth', 0.07, 60); },
  hurt() { tone(240, 0.35, 'sawtooth', 0.16, 70); noise(0.2, 0.15, 600); },
  power() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.12, 'triangle', 0.12, null, i * 0.07)); },
  zap() { tone(280, 0.18, 'sine', 0.07, 620); },
  alarm() { for (let i = 0; i < 4; i++) { tone(440, 0.18, 'square', 0.07, null, i * 0.4); tone(330, 0.18, 'square', 0.07, null, i * 0.4 + 0.2); } },
  boom() { noise(0.9, 0.35, 500); tone(120, 0.8, 'sawtooth', 0.12, 30); },
  laser() { tone(120, 0.7, 'sawtooth', 0.12, 60); noise(0.7, 0.15, 3000); },
  tink() { tone(1500, 0.05, 'square', 0.05, 1000); },
  pop() { noise(0.22, 0.18, 700); tone(260, 0.15, 'square', 0.05, 80); },
  over() { [392, 330, 262, 196].forEach((f, i) => tone(f, 0.25, 'triangle', 0.12, null, i * 0.18)); },
};
function setMuted(m) { muted = m; if (master) master.gain.value = m ? 0 : 0.5; try { localStorage.setItem('hh-muted', m ? '1' : '0'); } catch (e) {} }

// ---------- Game state ----------
let state = 'title', clock = 0, playTime = 0, dist = 0, speed = 200, skyClock = 0;
let score = 0, best = 0, combo = 0, comboT = 0, newBest = false, overT = 0;
try { best = parseInt(localStorage.getItem('hh-best') || '0', 10) || 0; } catch (e) {}
let darts = [], enemies = [], ebullets = [], obstacles = [], powerups = [], parts = [], texts = [];
let boss = null, bossClock = 0, bossWarn = 0, bossCount = 0;
let spawnT = 1.5, obsT = 9, shake = 0, hurtFlash = 0;
const P = { x: 200, y: 270, lives: 3, inv: 0, fireCd: 0, power: null, powerT: 0, shield: 0, tilt: 0, bob: 0 };
const target = { x: 200, y: 270 };
const mult = () => Math.min(5, 1 + Math.floor(combo / 4));

function reset() {
  playTime = 0; speed = 200; score = 0; combo = 0; comboT = 0; newBest = false;
  darts = []; enemies = []; ebullets = []; obstacles = []; powerups = []; texts = [];
  boss = null; bossClock = 0; bossWarn = 0; bossCount = 0; spawnT = 1.2; obsT = 9;
  Object.assign(P, { x: 200, y: 270, lives: 3, inv: 1.5, fireCd: 0, power: null, powerT: 0, shield: 0, tilt: 0 });
  target.x = 200; target.y = 270;
}
function startGame() {
  reset(); state = 'play';
  const el = document.documentElement;
  if (matchMedia('(pointer: coarse)').matches && el.requestFullscreen && !document.fullscreenElement) {
    el.requestFullscreen().then(() => screen.orientation && screen.orientation.lock && screen.orientation.lock('landscape').catch(() => {})).catch(() => {});
  }
  if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(() => {});
}
function gameOver() {
  state = 'over'; overT = 0; sfx.over();
  if (score > best) { best = score; newBest = true; try { localStorage.setItem('hh-best', String(best)); } catch (e) {} }
}

// ---------- Input ----------
const keys = {};
const pointers = new Map();
let mouseDown = false;
const BTN = () => ({ pause: { x: W - 62, y: 14, w: 46, h: 46 }, mute: { x: W - 116, y: 14, w: 46, h: 46 } });
const FIRE = () => ({ x: W - 96, y: H - 96, r: 54 });
const inBox = (p, b) => p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h;
function toLogical(e) { const r = cvs.getBoundingClientRect(); return { x: (e.clientX - r.left - ox) / sc, y: (e.clientY - r.top - oy) / sc }; }
function clampTarget() { target.x = clamp(target.x, 46, W * 0.62); target.y = clamp(target.y, 72, 466); }

cvs.addEventListener('pointerdown', e => {
  e.preventDefault(); ensureAudio();
  const p = toLogical(e), b = BTN();
  if (inBox(p, b.mute)) { setMuted(!muted); return; }
  if (state === 'title') { startGame(); return; }
  if (state === 'over') { if (overT > 0.9) startGame(); return; }
  if (state === 'pause') { state = 'play'; return; }
  if (inBox(p, b.pause)) { state = 'pause'; pointers.clear(); mouseDown = false; return; }
  if (e.pointerType === 'mouse') { mouseDown = true; target.x = p.x; target.y = p.y; clampTarget(); return; }
  pointers.set(e.pointerId, { role: p.x < W * 0.45 ? 'move' : 'fire', lx: p.x, ly: p.y, sx: p.x, sy: p.y });
  try { cvs.setPointerCapture(e.pointerId); } catch (err) {}
});
cvs.addEventListener('pointermove', e => {
  const p = toLogical(e);
  if (e.pointerType === 'mouse') { if (state === 'play') { target.x = p.x; target.y = p.y; clampTarget(); } return; }
  const t = pointers.get(e.pointerId); if (!t) return;
  if (t.role === 'move' && state === 'play') { target.x += (p.x - t.lx) * 1.6; target.y += (p.y - t.ly) * 1.6; clampTarget(); }
  t.lx = p.x; t.ly = p.y;
});
const endPointer = e => { if (e.pointerType === 'mouse') mouseDown = false; pointers.delete(e.pointerId); };
cvs.addEventListener('pointerup', endPointer);
cvs.addEventListener('pointercancel', endPointer);
cvs.addEventListener('contextmenu', e => e.preventDefault());

const KEYMAP = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', Space: 'fire', KeyJ: 'fire' };
window.addEventListener('keydown', e => {
  ensureAudio();
  if (KEYMAP[e.code]) { keys[KEYMAP[e.code]] = true; e.preventDefault(); }
  if (e.code === 'KeyM') setMuted(!muted);
  if (e.code === 'KeyP' || e.code === 'Escape') { if (state === 'play') state = 'pause'; else if (state === 'pause') state = 'play'; }
  if ((e.code === 'Enter' || e.code === 'Space') && (state === 'title' || (state === 'over' && overT > 0.9))) startGame();
});
window.addEventListener('keyup', e => { if (KEYMAP[e.code]) keys[KEYMAP[e.code]] = false; });
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') state = 'pause'; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; mouseDown = false; pointers.clear(); });

function isFiring() {
  if (keys.fire || mouseDown) return true;
  for (const p of pointers.values()) if (p.role === 'fire') return true;
  return false;
}

// ---------- Spawning ----------
function spawnWave() {
  const ufos = enemies.filter(e => e.type === 'ufo').length;
  const opts = [['blob', 1]];
  if (playTime > 10 && ufos < 2) opts.push(['ufo', 0.7]);
  if (playTime > 18) opts.push(['splitter', 0.55]);
  if (playTime > 24) opts.push(['squid', 0.6]);
  if (playTime > 32) opts.push(['beetle', 0.45]);
  if (playTime > 42) opts.push(['phantom', 0.45]);
  let r = Math.random() * opts.reduce((sum, o) => sum + o[1], 0), type = 'blob';
  for (const [t, w] of opts) { r -= w; if (r <= 0) { type = t; break; } }
  if (type === 'squid') {
    const n = playTime > 55 ? 2 : 1;
    for (let i = 0; i < n; i++) enemies.push({ type: 'squid', x: W + 40 + i * 70, y: rand(90, 440), r: 18, hp: 1, pts: 150, t: 0, phase: 'enter', stopX: W - rand(110, 220), vx: 0, vy: 0, flash: 0 });
  } else if (type === 'ufo') {
    const y = rand(90, 360);
    enemies.push({ type: 'ufo', x: W + 50, y, by: y, r: 26, hp: 2, pts: 250, t: 0, stopX: W - rand(120, 260), shootT: 1, flash: 0 });
  } else if (type === 'splitter') {
    const y = rand(110, 420);
    enemies.push({ type: 'splitter', x: W + 40, y, by: y, r: 26, hp: 2, pts: 200, t: 0, vx: rand(110, 150) * 1.1, flash: 0 });
  } else if (type === 'beetle') {
    enemies.push({ type: 'beetle', x: W + 50, y: rand(100, 440), r: 24, hp: 4, pts: 300, t: 0, vx: rand(80, 110) * 1.1, closed: true, flash: 0 });
  } else if (type === 'phantom') {
    enemies.push(makePhantom());
  } else {
    const n = 3 + ((Math.random() * 3) | 0), by = rand(110, 400), amp = rand(25, 70), f = rand(2, 3.5), vx = (rand(130, 190) + playTime * 0.8) * 1.1;
    for (let i = 0; i < n; i++) enemies.push({ type: 'blob', x: W + 40 + i * 58, y: by, by, amp, f, t: -i * 0.35, vx, r: 20, hp: 1, pts: 100, flash: 0 });
  }
}
const makePhantom = () => ({ type: 'phantom', x: rand(W * 0.5, W - 60), y: rand(90, 440), r: 20, hp: 2, pts: 350, t: 0, cyc: 0, vis: 0, jumps: 0, shot: false, flash: 0 });
const BANNERS = ['PIZZA 24/7', 'HOVER-SHOP', 'ALIENS? NEIN!', 'SALE -50%', 'STADTFEST'];
function spawnObstacle() {
  if (Math.random() < 0.5) obstacles.push({ type: 'blimp', x: W + 120, y: rand(110, 380), a: 76, b: 30, text: pick(BANNERS), t: 0 });
  else { const hy = rand(160, 330); obstacles.push({ type: 'crane', x: W + 100, hy, w: 170, h: 20, t: 0 }); }
}
const BOSS = [
  { name: 'KRAKEN-KREUZER', ea: 112, eb: 48, wob: [0.8, 140] },
  { name: 'PYRAMIDEN-AUGE', ea: 95, eb: 58, wob: [1.1, 150] },
  { name: 'RING-STATION', ea: 80, eb: 80, wob: [0.6, 120] },
];
function spawnBoss() {
  const kind = bossCount % 3;
  bossCount++;
  const hp = Math.round((40 + bossCount * 25) * DIFF);
  boss = Object.assign({ kind, x: W + 220, tx: W - 190, y: 270, hp, max: hp, t: 0, mt: 0, pat: 0, patT: 1.8, flash: 0, entering: true, burst: 0, burstT: 0, spiral: 0, spT: 0, sa: 0, laser: null, ring2: 0 }, BOSS[kind]);
}
function shootAt(x, y, a, s, r = 8, extra) { ebullets.push(Object.assign({ x, y, vx: Math.cos(a) * s * 1.15, vy: Math.sin(a) * s * 1.15, r }, extra)); }
function ringBurst(b, off) { for (let i = 0; i < 16; i++) shootAt(b.x, b.y, off + i * Math.PI / 8, 190); sfx.zap(); }
function bossAttack(b, dt) {
  const mx = b.x - b.ea * 0.7, my = b.y + 6;
  if (b.spiral > 0) { b.spiral -= dt; b.spT -= dt; if (b.spT <= 0) { b.spT = 0.06; b.sa += 0.42; shootAt(mx, my + 20, Math.PI + Math.sin(b.sa) * 1.15, 210); } }
  if (b.burst > 0) { b.burstT -= dt; if (b.burstT <= 0) { b.burst--; b.burstT = 0.18; const a = Math.atan2(P.y - my, P.x - mx); for (let i = -1; i <= 1; i++) shootAt(mx, my, a + i * 0.15, 300); sfx.zap(); } }
  if (b.ring2 > 0) { b.ring2 -= dt; if (b.ring2 <= 0) ringBurst(b, Math.PI / 16); }
  if (b.laser) {
    b.laser.t -= dt;
    if (b.laser.t <= 0) { if (b.laser.phase === 'warn') { b.laser.phase = 'fire'; b.laser.t = 0.7; sfx.laser(); addShake(6); } else b.laser = null; }
  }
  b.patT -= dt;
  if (b.patT > 0 || b.spiral > 0 || b.laser || b.burst > 0) return;
  const pat = b.pat++ % 3;
  b.patT = Math.max(1, 2.3 - bossCount * 0.2);
  if (b.kind === 0) {
    if (pat === 0) { b.spiral = 1.5; b.spT = 0; b.sa = 0; sfx.zap(); }
    else if (pat === 1) { b.burst = 3; b.burstT = 0; }
    else for (let i = 0; i < 2; i++) enemies.push({ type: 'squid', x: b.x - 60, y: b.y + (i ? 50 : -50), r: 18, hp: 1, pts: 150, t: 0, phase: 'enter', stopX: b.x - 160 - i * 50, vx: 0, vy: 0, flash: 0 });
  } else if (b.kind === 1) {
    if (pat === 0) { b.laser = { phase: 'warn', t: 0.9, y: b.y - 8 }; tone(200, 0.9, 'sawtooth', 0.05, 900); }
    else if (pat === 1) { for (let i = -2; i <= 2; i++) shootAt(mx, my, Math.PI + i * 0.35, 150, 10, { home: 1.6, col: 'orb' }); sfx.zap(); }
    else { for (let i = -4; i <= 4; i++) shootAt(mx, my, Math.PI + i * 0.16, 230); sfx.zap(); }
  } else {
    if (pat === 0) { ringBurst(b, 0); b.ring2 = 0.35; }
    else if (pat === 1) { for (let i = -1; i <= 1; i++) ebullets.push({ x: b.x - 50, y: b.y + i * 50, vx: -170 - Math.abs(i) * 40, vy: i * 70, r: 12, fuse: 1.5 + Math.random() * 0.4, col: 'mine' }); tone(150, 0.2, 'square', 0.06, 90); }

  if (matchMedia('(pointer: coarse)').matches || pointers.size) {
    const f = FIRE(), on = isFiring();
    ctx.fillStyle = on ? 'rgba(255,138,31,0.45)' : 'rgba(255,138,31,0.18)';
    ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, 7); ctx.fill();
    ctx.strokeStyle = 'rgba(255,246,232,0.5)'; ctx.lineWidth = 2; ctx.stroke();
    ctx.font = `15px ${FONT_D}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = 'rgba(255,246,232,0.85)'; ctx.fillText('FEUER', f.x, f.y);
    for (const p of pointers.values()) if (p.role === 'move') {
      ctx.strokeStyle = 'rgba(79,240,255,0.35)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(p.sx, p.sy, 34, 0, 7); ctx.stroke();
      ctx.fillStyle = 'rgba(79,240,255,0.3)'; ctx.beginPath(); ctx.arc(p.lx, p.ly, 16, 0, 7); ctx.fill();
    }
    if (playTime < 6) {
      ctx.globalAlpha = Math.min(1, (6 - playTime) / 1.5);
      textOut('← hier ziehen zum Fliegen', 24, H - 70, 18, '#9ff7ff', FONT_B);
      textOut('hier halten zum Schiessen →', W - 170, H - 170, 18, '#ffd23f', FONT_B, 'right');
      ctx.globalAlpha = 1;
    }
  }
}
function dim(a) { ctx.fillStyle = `rgba(14,10,32,${a})`; ctx.fillRect(0, 0, W, H); }
function drawTitle() {
  const g = ctx.createLinearGradient(W * 0.35, 0, W, 0); g.addColorStop(0, 'rgba(14,10,32,0)'); g.addColorStop(0.35, 'rgba(14,10,32,0.55)'); g.addColorStop(1, 'rgba(14,10,32,0.7)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const cx = W * 0.66;
  textOut('HOVERBOARD', cx, 130, 60, '#ff8a1f', FONT_D, 'center');
  textOut('HERO', cx, 196, 72, '#4ff0ff', FONT_D, 'center');
  textOut('Aliens greifen die Stadt an. Schnapp dir', cx, 246, 20, '#fff6e8', FONT_B, 'center');
  textOut('dein Hoverboard und deinen Dart-Blaster!', cx, 272, 20, '#fff6e8', FONT_B, 'center');
  const touch = matchMedia('(pointer: coarse)').matches;
  textOut(touch ? 'Links ziehen: fliegen  ·  Rechts halten: feuern' : 'Maus bewegen + klicken  ·  oder WASD + Leertaste', cx, 316, 16, '#d9cfff', FONT_B, 'center');
  const pulse = 0.6 + 0.4 * Math.sin(clock * 4);
  ctx.globalAlpha = pulse; textOut(touch ? 'TIPPEN ZUM STARTEN' : 'KLICKEN ZUM STARTEN', cx, 378, 26, '#ffd23f', FONT_D, 'center'); ctx.globalAlpha = 1;
  if (best > 0) textOut('Rekord: ' + best.toLocaleString('de-CH'), cx, 418, 18, '#fff6e8', FONT_B, 'center');
  if (cssH > cssW) textOut('Tipp: Handy quer halten', cx, 456, 16, '#9ff7ff', FONT_B, 'center');
  const b = BTN(); drawButton(b.mute, 'mute');
}
function drawOver() {
  dim(0.55);
  textOut('GAME OVER', W / 2, 180, 64, '#ff4f6d', FONT_D, 'center');
  textOut('Punkte: ' + score.toLocaleString('de-CH'), W / 2, 240, 30, '#fff6e8', FONT_B, 'center');
  if (newBest) textOut('NEUER REKORD!', W / 2, 284, 26, '#ffd23f', FONT_D, 'center');
  else textOut('Rekord: ' + best.toLocaleString('de-CH'), W / 2, 280, 20, '#d9cfff', FONT_B, 'center');
  if (overT > 0.9) { ctx.globalAlpha = 0.6 + 0.4 * Math.sin(clock * 4); textOut('Tippen für eine neue Runde', W / 2, 360, 24, '#4ff0ff', FONT_D, 'center'); ctx.globalAlpha = 1; }
}
function drawPause() {
  dim(0.5);
  textOut('PAUSE', W / 2, H / 2 - 10, 60, '#fff6e8', FONT_D, 'center');
  textOut('Tippen zum Weiterspielen', W / 2, H / 2 + 36, 22, '#d9cfff', FONT_B, 'center');
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#14102a'; ctx.fillRect(0, 0, cvs.width, cvs.height);
  ctx.setTransform(dpr * sc, 0, 0, dpr * sc, dpr * ox, dpr * oy);
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
  if (shake > 0) ctx.translate(rand(-shake, shake), rand(-shake, shake));
  const haze = drawSky();
  drawCity(haze);
  for (const o of obstacles) drawObstacle(o);
  for (const u of powerups) drawPowerup(u);
  for (const e of enemies) drawEnemy(e);
  if (boss) drawBoss();
  for (const p of parts) { ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.color; ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size); }
  ctx.globalAlpha = 1;
  if (state !== 'over') drawPlayer();
  for (const d of darts) drawDart(d);
  for (const b of ebullets) {
    if (b.col === 'mine') { drawMine(b); continue; }
    const c = b.col === 'orb' ? ['#7dff6a', 'rgba(125,255,106,0)'] : b.col === 'ghost' ? ['#4ff0ff', 'rgba(79,240,255,0)'] : ['#ff4fa3', 'rgba(178,107,255,0)'];
    const g = ctx.createRadialGradient(b.x, b.y, 1, b.x, b.y, b.r * 1.8);
    g.addColorStop(0, '#fff'); g.addColorStop(0.35, c[0]); g.addColorStop(1, c[1]);
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 1.8, 0, 7); ctx.fill();
  }
  for (const t of texts) { ctx.globalAlpha = Math.min(1, t.life * 2); textOut(t.text, t.x, t.y, t.size, t.color, FONT_D, 'center'); }
  ctx.globalAlpha = 1;
  ctx.restore();
  if (hurtFlash > 0) { ctx.fillStyle = `rgba(255,60,60,${hurtFlash * 0.8})`; ctx.fillRect(0, 0, W, H); }
  if (state === 'play' || state === 'pause') drawHUD();
  if (state === 'title') drawTitle();
  else if (state === 'over') drawOver();
  else if (state === 'pause') drawPause();
}

// ---------- Loop ----------
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
  const st = cvs.parentElement;
  if (Math.abs(st.clientWidth - cssW) > 1 || Math.abs(st.clientHeight - cssH) > 1) resize();
  try { update(dt); render(); } catch (err) { if (!frame.warned) { frame.warned = true; console.error(err); } }
}
buildLayers();
if (document.fonts && document.fonts.load) {
  Promise.all([document.fonts.load(`20px ${FONT_D}`), document.fonts.load(`700 20px ${FONT_B}`)]).then(buildLayers).catch(() => {});
}
window.__hh = { get state() { return state; }, get score() { return score; }, get enemies() { return enemies.length; }, get darts() { return darts.length; }, get player() { return { x: P.x, y: P.y, lives: P.lives }; } };
requestAnimationFrame(frame);
})();
</script>
